name: Her akşam 21.00'de paylaş

on:
  schedule:
    # 20:57 tetiki runner içinde 21:00'i bekler. Sonraki tetikler GitHub
    # gecikmelerine karşı 21:07-23:57 arasında on dakikada bir tekrar dener.
    # GitHub cron UTC kullanır; Türkiye UTC+3'tür.
    - cron: "57 17 * * *"
    - cron: "7,17,27,37,47,57 18-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-senol-gunes-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: En güncel paylaşım durumunu al
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sözü paylaş
        env:
          CONFIRM_POST: "true"
          ENFORCE_DAILY_LIMIT: "true"
          WAIT_UNTIL_POST_TIME: "true"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm start
      - name: Paylaşım durumunu kaydet
        run: |
          git config user.name "daily-senol-bot"
          git config user.email "daily-senol-bot@users.noreply.github.com"
          git add data/quotes.db data/last-post-date.txt
          git diff --cached --quiet || git commit -m "Sıradaki Şenol Güneş sözü paylaşıldı"
          git push
