name: Saat 21.00 tetikleyici

on:
  schedule:
    # 20:50'de uyanır; 21:00-23:50 arası GitHub gecikmelerine karşı tekrar dener.
    # Tüm saatler UTC'dir; Türkiye UTC+3 kullanır.
    - cron: "50 17 * * *"
    - cron: "*/10 18-20 * * *"
permissions:
  contents: write

jobs:
  run-daily-post:
    uses: ./.github/workflows/daily-post.yml
    with:
      scheduled: true
    secrets: inherit
